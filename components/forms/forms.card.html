<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 22px; }
  .group { background: var(--surface-card); border: 1px solid var(--border-subtle);
           border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: end; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Select, Checkbox } = window.ClearBizDebtDesignSystem_f45b76;
  const Mail = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>;
  function Demo() {
    return (
      <div className="group">
        <div className="grid" style={{ marginBottom: 16 }}>
          <Input label="Business name" placeholder="Acme Logistics LLC" />
          <Input label="Work email" type="email" icon={<Mail/>} placeholder="you@business.com" />
          <Select label="Approx. MCA balance" defaultValue="$100k – $250k">
            <option>Select a range…</option><option>$25k – $100k</option><option>$100k – $250k</option><option>$250k+</option>
          </Select>
          <Input label="Phone" defaultValue="555-019" error="Enter a 10-digit number" />
        </div>
        <Checkbox label="I agree to be contacted about resolving my MCA debt." defaultChecked />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

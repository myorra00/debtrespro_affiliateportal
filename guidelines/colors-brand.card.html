<!-- @dsCard group="Colors" viewport="700x160" name="Brand Colors" subtitle="Royal blue, deep navy, leafy green" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-lg); padding: 14px; height: 104px;
        display: flex; flex-direction: column; justify-content: flex-end; color: #fff; }
  .name { font-family: var(--font-display); font-size: var(--text-xs); font-weight: 600; }
  .hex { font-size: var(--text-2xs); font-family: var(--font-mono); opacity: 0.85; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--blue-600);"><div class="name">Royal Blue</div><div class="hex">#2563EB</div></div>
    <div class="sw" style="background: var(--blue-500);"><div class="name">Blue Accent</div><div class="hex">#3B82F6</div></div>
    <div class="sw" style="background: var(--navy-700);"><div class="name">Navy</div><div class="hex">#243A86</div></div>
    <div class="sw" style="background: var(--navy-900);"><div class="name">Navy Deep</div><div class="hex">#131F45</div></div>
    <div class="sw" style="background: var(--green-500);"><div class="name">Green</div><div class="hex">#62B22F</div></div>
  </div>
</body>
</html>

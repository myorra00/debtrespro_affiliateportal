<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-tint); padding: 32px; }
  h1 { font-family: var(--font-display); font-size: 48px; font-weight: 800; letter-spacing: -0.02em;
       line-height: 1.05; color: var(--ink-900); margin: 0; }
  .blue { color: var(--blue-500); }
  p { font-family: var(--font-sans); font-size: var(--text-lg); color: var(--ink-600); margin: 14px 0 0; }
</style>
</head>
<body>
  <h1>Secure Your<br>Business's <span class="blue">Future</span></h1>
  <p>Reduce Your MCA Debt and Improve Your Cash Flow</p>
</body>
</html>

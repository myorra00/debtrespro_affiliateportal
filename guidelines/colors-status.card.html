<!-- @dsCard group="Colors" viewport="700x150" name="Status & Tints" subtitle="Portal status colors + brand surface tints" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px; font-family: var(--font-sans); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { display: flex; flex-direction: column; gap: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--radius-pill);
           font-size: var(--text-xs); font-weight: 700; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .meta { font-size: 10px; font-family: var(--font-mono); color: var(--ink-400); }
  .tints { display: flex; gap: 12px; margin-top: 16px; }
  .tile { flex: 1; height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; padding: 0 12px;
          font-size: 11px; font-weight: 600; color: var(--ink-600); }
</style>
</head>
<body>
  <div class="row">
    <div class="chip"><span class="badge" style="background: var(--status-info-bg); color: var(--status-info);"><span class="dot"></span>Info</span><span class="meta">#2563EB</span></div>
    <div class="chip"><span class="badge" style="background: var(--status-success-bg); color: var(--status-success);"><span class="dot"></span>Success</span><span class="meta">#4F9A24</span></div>
    <div class="chip"><span class="badge" style="background: var(--status-warning-bg); color: var(--status-warning);"><span class="dot"></span>Warning</span><span class="meta">#B45309</span></div>
    <div class="chip"><span class="badge" style="background: var(--status-danger-bg); color: var(--status-danger);"><span class="dot"></span>Danger</span><span class="meta">#C8362C</span></div>
    <div class="chip"><span class="badge" style="background: var(--status-neutral-bg); color: var(--status-neutral);"><span class="dot"></span>Neutral</span><span class="meta">#717A8C</span></div>
  </div>
  <div class="tints">
    <div class="tile" style="background: var(--tint-blue); border:1px solid var(--blue-100);">Blue tint · #EEF4FB</div>
    <div class="tile" style="background: var(--blue-50); border:1px solid var(--blue-100);">Accent soft · #EEF4FF</div>
    <div class="tile" style="background: var(--green-50); border:1px solid var(--green-100);">Green tint · #EFF7E8</div>
  </div>
</body>
</html>

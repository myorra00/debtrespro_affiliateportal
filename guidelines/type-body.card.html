<!-- @dsCard group="Type" viewport="700x210" name="Body & Eyebrow — Mulish" subtitle="Humanist UI/body + uppercase overlines" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 24px; }
  .spec { padding: 9px 0; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: baseline; gap: 16px; }
  .spec:last-child { border-bottom: none; }
  .meta { font-size: 10px; font-family: var(--font-mono); color: var(--ink-400); margin-left: auto; white-space: nowrap; }
  .lead { font-size: var(--text-lg); color: var(--ink-600); }
  .body { font-size: var(--text-base); color: var(--ink-600); }
  .label { font-size: var(--text-xs); font-weight: 700; color: var(--ink-700); }
  .eyebrow { font-size: var(--text-3xs); font-weight: 700; letter-spacing: var(--tracking-wider);
             text-transform: uppercase; color: var(--blue-600); }
</style>
</head>
<body>
  <div class="spec"><span class="eyebrow">Why Choose DebtResolvePro</span><span class="meta">Eyebrow · 11/700 · 0.12em</span></div>
  <div class="spec"><span class="lead">Reduce your MCA debt and improve your cash flow.</span><span class="meta">Lead · 18/400</span></div>
  <div class="spec"><span class="body">We leverage our expertise, negotiation skills, and commitment to integrity to deliver effective resolutions.</span><span class="meta">Body · 16/400/1.5</span></div>
  <div class="spec"><span class="label">Business name</span><span class="meta">Label · 13/700</span></div>
</body>
</html>

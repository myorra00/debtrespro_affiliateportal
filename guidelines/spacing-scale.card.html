<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="8px rhythm with 4px half-steps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 24px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--blue-500); border-radius: var(--radius-xs); }
  .box { display: flex; align-items: flex-end; height: 52px; }
  .n { font-size: 10px; font-weight: 700; font-family: var(--font-display); color: var(--ink-700); }
  .px { font-size: 9px; font-family: var(--font-mono); color: var(--ink-400); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box"><div class="bar" style="width:4px;height:4px;"></div></div><div class="n">1</div><div class="px">4</div></div>
    <div class="item"><div class="box"><div class="bar" style="width:8px;height:8px;"></div></div><div class="n">2</div><div class="px">8</div></div>
    <div class="item"><div class="box"><div class="bar" style="width:12px;height:12px;"></div></div><div class="n">3</div><div class="px">12</div></div>
    <div class="item"><div class="box"><div class="bar" style="width:16px;height:16px;"></div></div><div class="n">4</div><div class="px">16</div></div>
    <div class="item"><div class="box"><div class="bar" style="width:24px;height:24px;"></div></div><div class="n">6</div><div class="px">24</div></div>
    <div class="item"><div class="box"><div class="bar" style="width:32px;height:32px;"></div></div><div class="n">8</div><div class="px">32</div></div>
    <div class="item"><div class="box"><div class="bar" style="width:40px;height:40px;"></div></div><div class="n">10</div><div class="px">40</div></div>
    <div class="item"><div class="box"><div class="bar" style="width:48px;height:48px;"></div></div><div class="n">12</div><div class="px">48</div></div>
  </div>
</body>
</html>

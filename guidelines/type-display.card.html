<!-- @dsCard group="Type" viewport="700x230" name="Display — Poppins" subtitle="Geometric headings, bold & tight" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 24px; }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); }
  .spec:last-child { border-bottom: none; }
  .meta { font-size: 10px; font-family: var(--font-mono); color: var(--ink-400); margin-left: auto; white-space: nowrap; }
  .t { font-family: var(--font-display); color: var(--ink-900); line-height: 1.1; }
</style>
</head>
<body>
  <div class="spec"><span class="t" style="font-size: 44px; font-weight: 800; letter-spacing: -0.02em;">Secure Your Future</span><span class="meta">Hero · 56/800</span></div>
  <div class="spec"><span class="t" style="font-size: 32px; font-weight: 700; letter-spacing: -0.015em;">Comprehensive Debt Resolution</span><span class="meta">H1 · 32/700</span></div>
  <div class="spec"><span class="t" style="font-size: 24px; font-weight: 700;">How It Works</span><span class="meta">H2 · 26/700</span></div>
  <div class="spec"><span class="t" style="font-size: 18px; font-weight: 600;">Debt Negotiation</span><span class="meta">H3 · 20/600</span></div>
</body>
</html>

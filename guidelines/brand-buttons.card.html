<!-- @dsCard group="Brand" viewport="700x180" name="Buttons & Swoosh" subtitle="Primary / outline CTAs + brand arc accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); padding: 28px; font-family: var(--font-sans); }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-display);
         font-weight: 600; font-size: 15px; border-radius: var(--radius-md); padding: 13px 22px; cursor: pointer; border: 1.5px solid transparent; }
  .primary { background: var(--blue-600); color: #fff; box-shadow: var(--shadow-btn-sm); }
  .outline { background: #fff; color: var(--blue-600); border-color: var(--blue-200, var(--blue-100)); border-color: var(--blue-500); }
  .green { background: var(--green-500); color: #fff; }
  .arc { height: 6px; width: 220px; border-radius: 999px; background: var(--gradient-arc); margin-top: 26px; }
  .arclabel { font-size: 11px; color: var(--ink-400); font-family: var(--font-mono); margin-top: 8px; }
  svg { width: 17px; height: 17px; }
</style>
</head>
<body>
  <div class="row">
    <button class="btn primary">Free Assessment <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    <button class="btn outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Call Us 866-757-3339</button>
    <button class="btn green">Get Started</button>
  </div>
  <div class="arc"></div>
  <div class="arclabel">--gradient-arc · green → blue</div>
</body>
</html>
